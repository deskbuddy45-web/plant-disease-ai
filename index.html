
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Disease AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef7f0;
      margin: 0;
      padding: 18px;
      text-align: center;
      color: #183b25;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 15px auto;
      max-width: 500px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #0002;
    }

    h2 { color: #176b38; }

    button {
      background: #176b38;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      margin: 10px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    #status { font-weight: bold; }

    .prediction {
      background: #eaf5ec;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h2>Plant Disease Detection AI</h2>

  <div class="card">
    <p id="status">Ready to start</p>
    <button id="startButton">Capture Leaf and Detect</button>
    <img id="cameraImage" style="display:none">
  </div>

  <div class="card">
    <h3>AI Prediction Results</h3>
    <div id="results">Waiting for leaf image...</div>
  </div>

  <canvas id="canvas" width="224" height="224"
          style="display:none"></canvas>

  <script type="module">

    import {
      loadLiteRt,
      loadAndCompile,
      Tensor
    } from "https://cdn.jsdelivr.net/npm/@litertjs/core/+esm";

    const CAMERA_URL = "http://10.90.23.165/capture";

    let model = null;
    let classes = [];
    let oldImageURL = null;
    // Treatment and prevention information for all 38 classes
const diseaseCare = {
  "Apple___Apple_scab": {
    treatment: "Remove fallen and infected leaves. Use a fungicide approved for apple scab when recommended locally.",
    prevention: "Clear fallen leaves, prune for airflow, and choose resistant apple varieties."
  },
  "Apple___Black_rot": {
    treatment: "Prune out infected branches and remove rotting fruit. Use a locally approved fungicide if advised.",
    prevention: "Remove mummified fruit, prune dead wood, and avoid tree injuries."
  },
  "Apple___Cedar_apple_rust": {
    treatment: "Remove nearby infected cedar galls where practical. Apply an approved fungicide at the recommended growth stage.",
    prevention: "Choose resistant varieties and avoid planting susceptible apples near infected junipers."
  },
  "Apple___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Water consistently, prune properly, and inspect leaves regularly."
  },
  "Blueberry___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Maintain acidic soil, good drainage, and regular watering."
  },
  "Cherry_(including_sour)___Powdery_mildew": {
    treatment: "Remove badly affected shoots. Use a fungicide approved for powdery mildew if necessary.",
    prevention: "Provide good airflow, avoid excessive nitrogen, and keep trees properly pruned."
  },
  "Cherry_(including_sour)___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Prune for airflow, water at the base, and monitor new leaves."
  },
  "Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot": {
    treatment: "Manage crop residue and use a locally recommended fungicide if disease is severe.",
    prevention: "Grow resistant hybrids, rotate crops, and avoid continuous maize planting."
  },
  "Corn_(maize)___Common_rust_": {
    treatment: "Use a locally approved fungicide when infection is early and significant.",
    prevention: "Plant resistant hybrids and monitor crops regularly."
  },
  "Corn_(maize)___Northern_Leaf_Blight": {
    treatment: "Remove or manage infected crop residue. Consider an approved fungicide when recommended.",
    prevention: "Grow resistant hybrids, rotate crops, and manage crop residue."
  },
  "Corn_(maize)___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Maintain balanced nutrition, proper spacing, and regular field monitoring."
  },
  "Grape___Black_rot": {
    treatment: "Remove infected berries and dead clusters. Use a grape-approved fungicide if locally recommended.",
    prevention: "Prune for airflow, remove fallen fruit, and avoid overhead irrigation."
  },
  "Grape___Esca_(Black_Measles)": {
    treatment: "Prune affected wood during dry weather and remove severely affected vines when necessary. There is no reliable cure for infected wood.",
    prevention: "Use healthy planting material, protect pruning wounds, and remove infected wood."
  },
  "Grape___Leaf_blight_(Isariopsis_Leaf_Spot)": {
    treatment: "Remove infected leaves and manage fallen plant debris. Use an approved fungicide if advised locally.",
    prevention: "Improve airflow, avoid wetting foliage, and maintain vineyard sanitation."
  },
  "Grape___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Prune regularly, maintain good drainage, and inspect leaves and fruit."
  },
  "Orange___Haunglongbing_(Citrus_greening)": {
    treatment: "There is no known cure. Contact a local agricultural expert about testing and removal of confirmed infected trees.",
    prevention: "Use certified disease-free plants and control the Asian citrus psyllid with locally approved methods."
  },
  "Peach___Bacterial_spot": {
    treatment: "Remove badly affected plant material where practical. Copper products may be considered only if approved and recommended locally.",
    prevention: "Plant resistant varieties, avoid overhead watering, and maintain airflow."
  },
  "Peach___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Prune properly, water at the base, and inspect leaves regularly."
  },
  "Pepper,_bell___Bacterial_spot": {
    treatment: "Remove severely infected plants when necessary. Use only locally approved products recommended for bacterial spot.",
    prevention: "Use disease-free seeds and seedlings, rotate crops, and avoid handling wet plants."
  },
  "Pepper,_bell___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Maintain good spacing, balanced nutrition, and consistent watering."
  },
  "Potato___Early_blight": {
    treatment: "Remove badly infected leaves. Use a potato-approved early-blight fungicide according to its label if needed.",
    prevention: "Rotate crops, remove infected debris, and avoid water stress."
  },
  "Potato___Late_blight": {
    treatment: "Remove and safely dispose of infected plants or tubers. Seek urgent local agricultural advice about approved late-blight control.",
    prevention: "Use certified seed potatoes, avoid prolonged leaf wetness, and inspect crops frequently."
  },
  "Potato___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Use healthy seed potatoes, rotate crops, and maintain proper soil drainage."
  },
  "Raspberry___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Prune old canes, maintain airflow, and avoid waterlogging."
  },
  "Soybean___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Use healthy seeds, rotate crops, and monitor plants regularly."
  },
  "Squash___Powdery_mildew": {
    treatment: "Remove badly affected leaves. Use a product approved for powdery mildew on squash if necessary.",
    prevention: "Provide good spacing, grow resistant varieties, and avoid excessive shade."
  },
  "Strawberry___Leaf_scorch": {
    treatment: "Remove affected leaves and manage infected plant debris. Ask a local expert about suitable fungicide options if severe.",
    prevention: "Use healthy planting material, improve airflow, and avoid overhead watering."
  },
  "Strawberry___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Use clean planting material, maintain drainage, and remove old leaves."
  },
  "Tomato___Bacterial_spot": {
    treatment: "Remove severely infected plants when necessary. Use only locally approved bacterial-spot management products.",
    prevention: "Use disease-free seeds, rotate crops, and avoid working with wet plants."
  },
  "Tomato___Early_blight": {
    treatment: "Remove infected lower leaves. Use a tomato-approved early-blight fungicide according to its label if needed.",
    prevention: "Mulch soil, water at the base, rotate crops, and provide good airflow."
  },
  "Tomato___Late_blight": {
    treatment: "Remove and safely dispose of infected plants. Seek prompt local agricultural advice about approved late-blight control.",
    prevention: "Use healthy seedlings, avoid prolonged leaf wetness, and inspect plants frequently."
  },
  "Tomato___Leaf_Mold": {
    treatment: "Remove infected leaves. Improve ventilation and use an approved fungicide only if recommended.",
    prevention: "Reduce humidity, improve airflow, and avoid overhead watering."
  },
  "Tomato___Septoria_leaf_spot": {
    treatment: "Remove infected lower leaves and dispose of plant debris. Use an approved fungicide if necessary.",
    prevention: "Rotate crops, mulch soil, and water at the base of plants."
  },
  "Tomato___Spider_mites Two-spotted_spider_mite": {
    treatment: "Wash mites from leaves with water. Use insecticidal soap or another locally approved miticide according to its label.",
    prevention: "Monitor leaf undersides, reduce dust, and avoid excessive dry conditions."
  },
  "Tomato___Target_Spot": {
    treatment: "Remove affected leaves and manage plant debris. Use a locally approved fungicide if recommended.",
    prevention: "Improve airflow, rotate crops, and avoid overhead irrigation."
  },
  "Tomato___Tomato_Yellow_Leaf_Curl_Virus": {
    treatment: "There is no direct cure. Remove confirmed infected plants and manage whiteflies using locally approved methods.",
    prevention: "Use healthy seedlings, control whiteflies, remove weeds, and use resistant varieties."
  },
  "Tomato___Tomato_mosaic_virus": {
    treatment: "There is no chemical cure. Remove infected plants and disinfect tools before handling healthy plants.",
    prevention: "Use certified seeds, wash hands, disinfect tools, and avoid tobacco contamination."
  },
  "Tomato___healthy": {
    treatment: "No disease detected. Continue normal care.",
    prevention: "Water consistently, provide adequate sunlight, and inspect leaves regularly."
  }
};

    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const preview = document.getElementById("cameraImage");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    async function loadAI() {

      if (model) return;

      status.innerText = "Loading AI model...";

      await loadLiteRt(
        "https://cdn.jsdelivr.net/npm/@litertjs/core/wasm/"
      );

      model = await loadAndCompile(
        "./plant_disease_model_fixed.tflite",
        { accelerator: "wasm" }
      );

      const response = await fetch("./plant_classes.json");

      if (!response.ok) {
        throw new Error("Could not load plant_classes.json");
      }

      const classData = await response.json();

      classes = Array.isArray(classData)
        ? classData
        : (classData.classes || classData.class_names ||
           Object.values(classData));

      if (classes.length !== 38) {
        throw new Error("Expected 38 class names, found " +
                        classes.length);
      }

      status.innerText = "AI model loaded successfully!";
    }

    async function captureAndPredict() {

      const response = await fetch(
        CAMERA_URL + "?t=" + Date.now(),
        {
          method: "GET",
          mode: "cors",
       cache: "no-store",
       targetAddressSpace: "local"
        }
      );

      if (!response.ok) {
        throw new Error("Camera capture failed: " +
                        response.status);
      }

      const blob = await response.blob();

      if (!blob.type.includes("image")) {
        throw new Error("Camera did not return an image");
      }

      if (oldImageURL) {
        URL.revokeObjectURL(oldImageURL);
      }

      oldImageURL = URL.createObjectURL(blob);
      preview.src = oldImageURL;
      preview.style.display = "block";

      const bitmap = await createImageBitmap(blob);

      ctx.drawImage(bitmap, 0, 0, 224, 224);
      bitmap.close();

      const pixels = ctx.getImageData(
        0, 0, 224, 224
      ).data;

      const inputData = new Float32Array(
        224 * 224 * 3
      );

      let j = 0;

      for (let i = 0; i < pixels.length; i += 4) {
        inputData[j++] = pixels[i];
        inputData[j++] = pixels[i + 1];
        inputData[j++] = pixels[i + 2];
      }

      const inputTensor = new Tensor(
        inputData,
        [1, 224, 224, 3]
      );

      const outputs = await model.run(inputTensor);

      const scores = await outputs[0].data();

      const ranking = Array.from(scores)
        .map((score, index) => ({
          index,
          score
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      results.innerHTML = "";

      ranking.forEach((item, position) => {

        const name = String(classes[item.index])
          .replace("___", " - ")
          .replace(/_/g, " ");

        const percentage = (item.score * 100).toFixed(2);

        const div = document.createElement("div");
        div.className = "prediction";

        const heading = document.createElement("strong");
        heading.textContent = (position + 1) + ". " + name;

        const confidence = document.createElement("p");
        confidence.textContent =
          "Confidence: " + percentage + "%";

        div.appendChild(heading);
        div.appendChild(confidence);
        results.appendChild(div);
      });

      inputTensor.delete();
      outputs.forEach(t => t.delete());

      status.innerText = "Prediction completed!";
    }

    document.getElementById("startButton")
      .addEventListener("click", async () => {

        const button = document.getElementById("startButton");
        button.disabled = true;

        try {
          status.innerText = "Starting...";

          await loadAI();

          status.innerText = "Capturing plant image...";

          await captureAndPredict();

        } catch (error) {
          console.error(error);
          status.innerText = "ERROR: " + error.message;

        } finally {
          button.disabled = false;
        }
      });

  </script>

</body>
</html>
